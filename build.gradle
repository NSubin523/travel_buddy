buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 8.2.2 is stable and works great with Gradle 8.5 + Java 21
        classpath "com.android.tools.build:gradle:8.2.2"
        // Kotlin 1.9.22 is required for newer AGP and Java 21 support
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
        // Updated Google Services for compatibility
        classpath 'com.google.gms:google-services:4.4.0'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}